blockExoticSubdeps: true
preferFrozenLockfile: true
savePrefix: ""

minimumReleaseAge: 4320 # >=3 days
minimumReleaseAgeExclude:
  - "waku@1.0.0-beta.0"
  - "@pretty-cozy/oxlint-config@0.1.0-alpha.0"

trustPolicy: no-downgrade
trustPolicyExclude:
  - "semver@6.3.1" # https://github.com/npm/node-semver/issues/838

ignoreWorkspaceRootCheck: true
packages:
  - "packages/*"
